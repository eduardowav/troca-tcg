<!doctype html>
<html lang="pt-BR" data-mundo="brutal">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- O iOS ignora o SVG e o manifesto: quem vira ícone na tela de início do
         iPhone é este PNG, e sem ele o sistema faz uma miniatura da página. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFDF5" />
    <meta
      name="description"
      content="Descubra com quem trocar suas cartas de Pokémon TCG. Ofereço, Procuro e o app acha o match."
    />
    <title>TrocaTCG</title>

    <!--
      A prévia do link.

      O lançamento é por grupo de WhatsApp (ver "O risco número um", seção 21),
      e sem estas linhas o link colado no grupo aparece como uma faixa cinza com
      o endereço cru. A diferença entre isso e um cartão com arte é a diferença
      entre alguém tocar e ninguém tocar — é a única peça de divulgação que o app
      tem, e ela custa dez linhas.

      A `og:image` é absoluta de propósito: caminho relativo funciona no
      navegador e falha em todo raspador de prévia, que busca a imagem sem ter
      uma página base. Como o app não tem domínio próprio (decisão de custo zero,
      2026-08-14), o endereço é o do Render — e é ele que precisa mudar no dia em
      que um domínio entrar.

      `summary_large_image` é o formato de cartão grande do Twitter/X. Sem esta
      linha ele usa a miniatura quadrada e recorta o meio da arte.

      A imagem sai de `scripts/gerar-og.mjs`, da mesma marca dos ícones.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrocaTCG" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="TrocaTCG — troque cartas sem procurar" />
    <meta
      property="og:description"
      content="Você diz o que tem e o que quer. O app acha com quem trocar, aqui em Belém."
    />
    <meta property="og:url" content="https://trocatcg-web.onrender.com" />
    <meta property="og:image" content="https://trocatcg-web.onrender.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Lida por leitor de tela quando a prévia é anunciada, e é o único texto
         alternativo que uma imagem de compartilhamento pode ter. -->
    <meta
      property="og:image:alt"
      content="Três cartas em leque com as setas de troca, ao lado da frase: troque cartas sem procurar."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      O tema, antes da primeira pintura.

      Precisa ser um script bloqueante no `<head>`, e não código do React: o
      bundle só roda depois do primeiro quadro, e nesse quadro a página seria
      creme. Quem escolheu escuro veria um flash branco a cada abertura — que é
      exatamente o que mais incomoda em modo escuro mal feito, e num PWA aberto
      dezenas de vezes por dia isso não passa despercebido.

      Duas linhas, sem dependência, deliberadamente burro: a lógica de verdade
      mora em `src/stores/tema.ts`, e este trecho só precisa acertar o atributo.
      `try` porque `localStorage` lança em modo restrito de alguns navegadores, e
      falhar aqui derrubaria a página inteira antes de qualquer coisa carregar.
    -->
    <script>
      try {
        var t = localStorage.getItem('troca:tema')
        var escuro =
          t === 'escuro' ||
          (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (escuro) {
          document.documentElement.dataset.tema = 'escuro'
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#0B0B0D')
        }
      } catch (e) {}
    </script>

    <!--
      ============================================================
      CONTRATO DE DIREÇÃO — ver DESIGN.md
      ============================================================
      WORLD: neobrutalismo de papel. A troca acontece sobre papel
        creme, com borda preta grossa, sombra dura sem blur e cor
        chapada. Fonte: Figma "TrocaTCG — Design".
      OWN-WORLD: azul chapado é ação e só ação; âmbar é raridade de
        topo; vermelho é o que não tem volta. Elevação por sombra
        deslocada, nunca por brilho. Mono para todo dado frio — id,
        código de set, nota, data, prazo.
        Tipo: Outfit (título), Inter (corpo), Geist Mono (dado).
      STORY: o jogador declara Ofereço/Procuro em segundos e o app
        cruza sozinho. A troca aparece pronta, com as duas cartas
        lado a lado e quem está do outro lado.
      FORM: quadro de trocas mobile-first. Motion quase ausente: só
        a sombra que salta no toque e a pokébola das telas que ainda
        não existem. prefers-reduced-motion respeitado.
      ============================================================
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
