<!--
  A marca sobre fundo escuro.

  Irmã de `marca.svg`, exportada do mesmo arquivo do Figma. Muda o que precisava
  mudar no escuro: o traço, que era preto, vira #F6F7FA, e o azul das cartas sobe
  de #0038FF para #1F4FFE — o azul do claro fecha demais contra preto.

  O retângulo #1E1E1E do artboard foi removido na exportação de propósito: a
  marca precisa ser transparente para assentar sobre a superfície que estiver
  atrás dela, que muda de pele para pele. Fundo embutido viraria um quadrado
  cinza flutuando sobre o papel escuro.

  Não é fonte de ícone. O favicon e os ícones do PWA saem de `marca.svg` por
  `scripts/gerar-icones.mjs`; esta existe só para tela.
-->
