<!--
  O ícone do TrocaTCG.

  Exportada de `idv_troca_tcg/logo_finalizada/SVG`, a identidade fechada em
  2026-08-19. Os paths são os do arquivo, byte a byte. Duas mudanças na
  importação, e só duas: o `<style>`/`class` do Illustrator virou um `fill` no
  `<svg>` (a cor é herdada pelas formas, e classe `cls-1` dentro de arquivo
  embutido em outro colide com a do vizinho — o `gerar-og.mjs` embute dois), e
  o `<?xml?>` saiu, que só serve a arquivo servido como XML.

  Azul e só azul, nos dois temas: a identidade não tem versão de traço claro
  para o escuro — #0067FF dá 4,19:1 sobre o bege e 3,71:1 sobre o #171717, e
  ambos passam o piso de 3:1 que vale para desenho. Por isso este arquivo não
  tem irmã escura, e a regra que trocava o `content` no tema escuro saiu do
  `index.css`.

  É daqui que saem o favicon e os ícones do PWA (`scripts/gerar-icones.mjs`) e a
  imagem de compartilhamento (`scripts/gerar-og.mjs`). Trocou o ícone, troque
  este arquivo e rode os dois — nenhum outro lugar guarda cópia da arte.

  A palavra "TrocaTCG" é peça separada, em `palavra.svg`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" fill="#0067FF">
