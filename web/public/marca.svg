<!--
  A marca do TrocaTCG — três cartas em leque com as setas da troca na da frente.

  Exportada do Figma ("Ícone", node 1:14) e usada sem redesenho: os paths são os
  do arquivo, byte a byte. Duas mudanças deliberadas, e só duas:

    1. Saiu o retângulo de fundo do canvas: ele é a mesa do Figma, não a marca.
    2. O azul virou #0038FF, o azul de ação do app (o token `color-azul`), no
       lugar do #1F4FFE do arquivo. Dois azuis quase iguais lado a lado — marca
       e botão — leem como erro de impressão, e quem cede é a marca, que aparece
       uma vez por tela, não o botão, que aparece em todas.

  Este arquivo é a fonte única da marca. Dele saem, por
  `scripts/gerar-icones.mjs`, o `favicon.svg` (a mesma arte sobre o papel do
  app, em quadrado arredondado) e os PNGs do PWA. O cabeçalho do app exibe este
  aqui, sem fundo, porque ali a marca já está sobre o papel.

  Sem hífen duplo nos comentários: em XML ele encerra o comentário, e o
  navegador passa a tratar o arquivo como imagem quebrada — foi o que aconteceu
  quando este texto citava a variável CSS com os dois traços.
-->
