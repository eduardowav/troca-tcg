name: Jobs agendados

# Dispara os jobs internos da API por cron. As rotas /internal/* são protegidas
# por header X-Job-Secret. Ver seções 5 e 18 da doc.
on:
  schedule:
    - cron: '0 9 * * *'      # 06:00 BRT — recomputa triangulares + expira vencidos
    - cron: '*/15 * * * *'   # notifica "procuram sua carta" e "a carta apareceu"
  workflow_dispatch:

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar jobs internos
        env:
          API_URL: ${{ secrets.API_URL }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$JOB_SECRET" ]; then
            echo "Secrets API_URL/JOB_SECRET ainda não configurados — jobs em espera."
            exit 0
          fi
          chamar() {
            curl -sf -X POST "$API_URL/v1/internal/jobs/$1" \
                 -H "X-Job-Secret: $JOB_SECRET" --fail
          }
          # Notificações rodam em todo disparo (inclusive no de 15 min). Os dois
          # sentidos da mesma novidade: `notify-wanted` avisa quem oferece que
          # passaram a procurar a carta dele; `notify-alerts` avisa quem pediu
          # para ser avisado que a carta apareceu no Ofereço de alguém.
          chamar notify-wanted || echo "notify-wanted falhou"
          chamar notify-alerts || echo "notify-alerts falhou"
          # Tarefas diárias: só na janela das 06:00 BRT (09:00 UTC).
          if [ "$(date -u +%H:%M)" = "09:00" ]; then
            chamar triangular || echo "triangular falhou"
            chamar expire || echo "expire falhou"
            # Pagamentos: webhook se perde, e quando se perde ninguém percebe —
            # o Pix saiu da conta da pessoa e o app não mudou. Esta passada
            # confere os pendentes no Mercado Pago e derruba quem passou da data
            # comprada.
            chamar reconciliar-pagamentos || echo "reconciliar-pagamentos falhou"
            # E o aviso de vencimento, que é a contrapartida de o Pix não
            # renovar sozinho: sem ele o churn é silencioso.
            chamar avisar-vencimento || echo "avisar-vencimento falhou"
          fi
          # Câmbio: na janela das 11:30 BRT, e mais tarde de propósito. Pega
          # carona no disparo de 15 em 15 minutos, que já passa por aqui — uma
          # entrada de cron própria só faria dois workflows rodarem no mesmo
          # minuto. A PTAX do dia sai por volta das 13h UTC; às 09:00 UTC o
          # boletim ainda não existe e o job guardaria sempre a cotação da
          # véspera. Falha aqui não apaga a linha anterior — ver
          # services/cambio.py.
          if [ "$(date -u +%H:%M)" = "14:30" ]; then
            chamar cambio || echo "cambio falhou"
          fi
