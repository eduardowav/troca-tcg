name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # O CSP autoriza o script inline do tema por hash do conteúdo. Mudar aquele
      # script sem trocar o hash não quebra o app — só faz o navegador bloqueá-lo
      # e voltar o flash branco no modo escuro, meses depois, sem ninguém ligar
      # uma coisa à outra. Aqui a falha é imediata e diz qual é o hash novo.
      - run: npm run conferir:csp
