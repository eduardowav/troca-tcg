name: Keep-alive

# Mantém a API do Render acordada (hiberna em 15 min) e o projeto Supabase
# ativo (pausa em 7 dias). O /v1/health consulta o banco de verdade, então
# um único ping resolve os dois. Ver seção 6 da doc.
on:
  schedule:
    - cron: '*/10 * * * *'   # a cada 10 min, dentro dos 15 do Render
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /v1/health
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Secret API_URL ainda não configurado — keep-alive em espera."
            exit 0
          fi
          curl -sf "$API_URL/v1/health"
