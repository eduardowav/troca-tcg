# Infraestrutura do TrocaTCG no Render — a fonte da verdade do deploy.
#
# Dois serviços, um repositório: a API FastAPI e o PWA estático. O banco NÃO
# está aqui de propósito — é o Supabase em sa-east-1, com 16 mil cartas dentro.
# Declarar um Postgres neste arquivo criaria um segundo banco vazio.
#
# Aplicar: https://dashboard.render.com/blueprint/new?repo=https://github.com/eduardowav/troca-tcg
# Ver docs/INFRA.md para o que precisa ser preenchido à mão depois.

services:
  # ------------------------------------------------------------------ API
  - type: web
    name: trocatcg-api
    runtime: python
    plan: free
    # O Render não tem região na América do Sul (oregon, ohio, virginia,
    # frankfurt, singapore). O Supabase está em São Paulo, então virginia é a
    # menos ruim — ~120 ms de ida e volta contra ~180 de oregon. Como o feed
    # ainda faz ~30 consultas por abertura, essa escolha vale segundos por tela.
    region: virginia
    rootDir: api
    healthCheckPath: /v1/health
    autoDeployTrigger: commit

    # O projeto usa uv, que o runtime Python do Render não conhece — ele
    # detecta `pyproject.toml` e assume Poetry, que não é o caso. Exportar o
    # lock para requirements e instalar com pip resolve sem depender dessa
    # heurística, e mantém o uv.lock como a única fonte de versões.
    # `--no-emit-project` porque a API roda do fonte, não instalada como pacote.
    buildCommand: >-
      pip install uv &&
      uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements.txt &&
      pip install -r requirements.txt

    # `--proxy-headers` com `--forwarded-allow-ips` não é detalhe: sem eles o
    # `request.client.host` é o IP do proxy do Render, e o freio da API passaria
    # a valer para o app inteiro somado em vez de por pessoa. O curinga é seguro
    # aqui porque o serviço só é alcançável através do proxy do Render.
    #
    # De julho a 2026-08-16 este comentário descrevia uma proteção que não
    # existia: o rate limit estava configurado e não contava nada. Agora conta —
    # e o `core/limitador.py` lê o `x-forwarded-for` por conta própria, então a
    # proteção não depende só destas flags.
    startCommand: >-
      python -m uvicorn app.main:app
      --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips="*"

    # Monorepo: commit que só mexe no PWA não precisa reconstruir a API. Os
    # minutos de pipeline são compartilhados entre os dois serviços no free.
    buildFilter:
      paths:
        - api/**
      ignoredPaths: []

    envVars:
      # O pyproject exige >=3.12 e o padrão do Render é 3.11. Se o build
      # reclamar da versão exata, é esta linha que muda.
      - key: PYTHON_VERSION
        value: 3.12.8

      # Pooler do Supabase (Supavisor), porta 5432 = session mode. A 6543 não
      # suporta prepared statements, que o asyncpg usa por padrão. O host
      # direto só tem AAAA (IPv6). Ver api/.env.example.
      - key: DATABASE_URL
        sync: false

      # A URL basta: é dela que sai o JWKS que valida a sessão de quem entra.
      #
      # `SUPABASE_SERVICE_ROLE_KEY` e `SUPABASE_JWT_SECRET` NÃO estão aqui de
      # propósito. A primeira está declarada no config.py e não é lida por
      # linha nenhuma do app — é uma chave que fura o RLS, e não pô-la no
      # ambiente é melhor do que pô-la. A segunda só serve ao ramo HS256 do
      # auth.py, e o JWKS deste projeto publica apenas ES256: os tokens são
      # assimétricos, validados por chave pública. Se um dia o Supabase voltar
      # a emitir HS256, o erro é explícito ("Servidor sem SUPABASE_JWT_SECRET")
      # e a variável entra pelo painel em trinta segundos.
      - key: SUPABASE_URL
        value: https://qbdtcpotehvbkozppmyu.supabase.co

      # Gerado pelo Render. Copie o valor para o GitHub Secret JOB_SECRET —
      # é ele que abre as rotas /internal/jobs/* para o cron do Actions.
      - key: JOB_SECRET
        generateValue: true

      # Precisa bater com a constante VERSAO em web/src/routes/Termos.tsx: é
      # este valor que vai para term_acceptances e prova qual texto a pessoa
      # aceitou. O default do config.py acompanha os dois desde 2026-08-14 —
      # antes ele estava defasado e registraria uma versão que não existe.
      - key: TERMOS_VERSAO
        value: '2026-08-15'

      # A origem do PWA. Some o domínio próprio aqui quando ele existir.
      - key: CORS_ORIGINS
        value: https://trocatcg-web.onrender.com

      # Web Push. A pública é a mesma do `VITE_VAPID_PUBLIC_KEY` do PWA e pode
      # ficar aqui — é ela que o navegador guarda para reconhecer o remetente
      # autorizado. A privada entra pelo painel (`sync: false`): trocar o par
      # invalida toda inscrição existente, e cada pessoa precisaria ligar o
      # aviso de novo. Sem as duas, o push não sai e o app segue inteiro.
      - key: VAPID_PUBLIC_KEY
        value: BHQHBKdi7RzxVN3qd76b6AI-JyGxXA_7Uo4tIeLfVhl6GErvWfIe1hnTAL64FRA7iRkyQgl_cOYvr-ujJqt-MSw
      - key: VAPID_PRIVATE_KEY
        sync: false
      # O contato que o FCM e a Apple procuram antes de bloquear um remetente.
      # Precisa ser uma caixa que alguém leia: era `contato@trocatcg.com.br`, e
      # esse domínio não é do projeto — está registrado por outra pessoa.
      - key: VAPID_SUBJECT
        value: mailto:eduardowav@icloud.com

      # Mercado Pago — assinatura do PRO (Fase C da seção 16).
      #
      # O access token e o segredo do webhook entram pelo painel (`sync: false`):
      # o token move dinheiro e o segredo é o que separa uma notificação do
      # Mercado Pago de um POST qualquer na rota pública. Vazios, as rotas de
      # assinatura respondem 503 e o receptor recusa tudo — que é o estado certo
      # de um ambiente sem credencial.
      #
      # Os ids dos planos ficam aqui porque não são segredo: são o "qual plano",
      # não o "quem pode". Mas atenção, eles são **de produção** — os que estão
      # no `api/.env` foram criados com credencial de teste e não valem aqui.
      # Preencher com os de produção no dia em que a aplicação for ativada.
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADO_PAGO_PLANO_MENSAL
        sync: false
      - key: MERCADO_PAGO_PLANO_ANUAL
        sync: false
      # Para onde o Mercado Pago devolve quem terminou o checkout.
      - key: MERCADO_PAGO_BACK_URL
        value: https://trocatcg-web.onrender.com/planos

      # Painel de erro (item 15 da seção 17). Pelo painel (`sync: false`) porque
      # DSN é endereço de escrita: quem o tem manda evento para a conta do
      # projeto, e um repositório público não é lugar para isso. Vazio, o
      # `core/monitoramento.py` não inicializa nada e a API sobe igual.
      #
      # O `RENDER_GIT_COMMIT` que acompanha o evento é publicado pela própria
      # plataforma — não precisa ser declarado aqui.
      - key: SENTRY_DSN
        sync: false

      - key: ENVIRONMENT
        value: production

  # ------------------------------------------------------------------ PWA
  - type: web
    runtime: static
    name: trocatcg-web
    rootDir: web
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    buildFilter:
      paths:
        - web/**
      ignoredPaths: []

    # SPA: o React Router resolve as rotas no navegador, então o CDN precisa
    # devolver o index.html em vez de 404 para qualquer caminho — sem isto,
    # recarregar a página em /matches quebra.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      # Content-Security-Policy — item 6 do bloco de segurança da seção 17.
      #
      # A sessão do Supabase mora em `localStorage`, então um XSS não vaza uma
      # tela: leva a conta inteira. Não há injeção conhecida hoje (não existe
      # `dangerouslySetInnerHTML`, `innerHTML` nem `eval` no `web/src`), e é
      # justamente por isso que a rede vale a pena agora — enquanto é barata.
      #
      # `script-src` sem `'unsafe-inline'`, com o script do tema autorizado por
      # **hash**. Ele precisa ser inline (roda antes da primeira pintura, senão
      # volta o flash branco no modo escuro), e liberar todo inline para acomodar
      # um script desligaria a proteção inteira. Mudou aquele script? O hash muda
      # junto — `npm run conferir:csp` falha no CI dizendo qual é o novo.
      #
      # `style-src` **com** `'unsafe-inline'`, e essa assimetria é deliberada: o
      # React e o motion escrevem `style=` em elemento, que o CSP trata como
      # estilo inline. Sem isso, toda animação e todo estilo calculado somem. CSS
      # injetado é um problema de aparência; script injetado é a conta da pessoa.
      #
      # `img-src https:` aceita qualquer origem segura porque `avatar_url` é um
      # endereço que a pessoa escolhe. O schema já exige `https://`, e imagem não
      # executa — a alternativa seria hospedar avatar, que o projeto não faz.
      #
      # `connect-src` lista o Supabase (REST, Auth e o `wss` do Realtime, que o
      # sino usa), a API e o Sentry. `frame-ancestors 'none'` é o
      # `X-Frame-Options` acima em versão moderna; os dois ficam, porque
      # navegador velho só entende o primeiro.
      #
      # O Sentry entra por curinga de subdomínio porque o host do DSN carrega o
      # id da organização (`o4508…​.ingest.us.sentry.io`) — o curinga cobre a
      # criação do projeto sem exigir um deploy só para ajustar o cabeçalho. Os
      # dois hosts são as duas formas que a Sentry emitiu ao longo do tempo; se
      # a organização for criada na região europeia, o sufixo vira `.de.` e esta
      # linha precisa mudar junto, **senão o evento é bloqueado calado** — o
      # navegador recusa a requisição e o painel fica vazio parecendo silêncio
      # bom.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          base-uri 'self';
          object-src 'none';
          frame-ancestors 'none';
          form-action 'self';
          script-src 'self' 'sha256-Mg5tnyEJlEV3POYjJrk82Cx8n71agVsy/WCYbBG5p8Y=';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data: blob: https:;
          connect-src 'self'
          https://qbdtcpotehvbkozppmyu.supabase.co
          wss://qbdtcpotehvbkozppmyu.supabase.co
          https://trocatcg-api.onrender.com
          https://*.ingest.sentry.io
          https://*.ingest.us.sentry.io;
          manifest-src 'self';
          worker-src 'self';
          upgrade-insecure-requests
      # O Vite versiona o nome de cada asset por hash, então o arquivo em
      # /assets nunca muda de conteúdo — cachear para sempre é seguro e é o
      # que faz a segunda visita não baixar nada.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    envVars:
      # Chaves públicas por design (vão no bundle). A proteção é o RLS no
      # banco, que está ativo. A service_role nunca entra aqui.
      - key: VITE_SUPABASE_URL
        value: https://qbdtcpotehvbkozppmyu.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_fnmDKHi19WNJU3SrDp5WeQ_RsuTbo_W

      # Literal, não `fromService`: site estático não fica na rede privada do
      # Render, e a propriedade `host` devolveria o hostname interno — que o
      # navegador de quem usa o app não alcança.
      - key: VITE_API_URL
        value: https://trocatcg-api.onrender.com/v1

      # A mesma chave pública VAPID da API. Entra no bundle de propósito: é o
      # que o navegador precisa ter em mãos na hora de se inscrever no serviço
      # de push. A privada não tem par aqui e nunca terá.
      - key: VITE_VAPID_PUBLIC_KEY
        value: BHQHBKdi7RzxVN3qd76b6AI-JyGxXA_7Uo4tIeLfVhl6GErvWfIe1hnTAL64FRA7iRkyQgl_cOYvr-ujJqt-MSw

      # O DSN do Sentry do PWA — **outro** DSN, não o mesmo da API: são dois
      # projetos no painel, senão o erro do navegador e o do servidor caem na
      # mesma lista e param de dizer de onde vieram.
      #
      # Vai para o bundle, como todo `VITE_`, e isso é aceitável: DSN é endereço
      # de escrita, não credencial de leitura — quem o tem pode mandar evento,
      # não ler nenhum. É por isso que o do backend está em `sync: false` (num
      # repositório público não convém publicá-lo à toa) e este também: assim o
      # valor só existe no painel do Render, e um fork do repositório não sai
      # gastando a cota de 5 mil eventos do projeto.
      - key: VITE_SENTRY_DSN
        sync: false
